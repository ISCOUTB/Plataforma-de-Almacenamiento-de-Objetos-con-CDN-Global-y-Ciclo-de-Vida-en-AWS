name: Checkov Security Scan

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Analizar seguridad con Checkov
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Ejecutar Checkov
        id: checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov==3.4.3
          checkov -d . --framework terraform --quiet --output sarif --output-file-path . --soft-fail
          python3 - <<'PY'
          import json
          import os

          with open("results_sarif.sarif", encoding="utf-8") as sarif_file:
              sarif = json.load(sarif_file)

          if sarif.get("version") != "2.1.0" or not isinstance(sarif.get("runs"), list):
              raise SystemExit("Checkov did not generate a valid SARIF 2.1.0 document")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sarif_ready=true\n")
          PY

      - name: Subir resultados SARIF a GitHub
        if: always() && steps.checkov.outputs.sarif_ready == 'true' && hashFiles('results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results_sarif.sarif
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Mostrar resultados de Checkov
        if: always()
        run: |
          if [ -f results_sarif.sarif ]; then
            echo "Resultados en SARIF disponibles en GitHub Security > Code scanning."
          else
            echo "No se generaron resultados SARIF; revisa la ejecución de Checkov."
          fi
