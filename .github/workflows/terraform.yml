name: Terraform CI/CD

on:
  pull_request:
    branches:
      - master
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/*.yml"

  push:
    branches:
      - master
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "modules/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/*.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Revisar formato
        run: terraform fmt -check -recursive

      - name: Inicializar proveedores
        run: terraform init -backend=false -input=false

      - name: Validar configuración
        run: terraform validate -no-color

  deploy:
    name: Plan y Apply en AWS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_REGION: us-east-1

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraform

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Inicializar backend remoto
        run: terraform init -input=false

      - name: Crear Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Ejecutar Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
