name: Destroy Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY to authorize planning and deleting production infrastructure
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: domusnet-terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  validate:
    name: Validate destroy request
    runs-on: ubuntu-latest
    steps:
      - name: Require production branch, confirmation, and credentials
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_TERRAFORM_DESTROY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_DESTROY_ROLE_ARN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Run this workflow from the master branch."
            exit 1
          fi

          if [ "$CONFIRMATION" != "DESTROY" ]; then
            echo "::error::Type DESTROY to confirm this request."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          if [ -z "$AWS_TERRAFORM_DESTROY_ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_TERRAFORM_DESTROY_ROLE_ARN is missing."
            exit 1
          fi

  plan-destroy:
    name: Review destroy plan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: domusnet-terraform-destroy-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan CloudFront teardown first
        run: terraform plan -destroy -target=module.cloudfront -input=false -no-color -out=tfplan-cloudfront

      - name: Plan remaining infrastructure
        run: terraform plan -destroy -input=false -no-color -out=tfplan-full

      - name: Publish both destroy plans for review
        run: |
          {
            echo "## Stage 1: CloudFront teardown and its dependencies"
            terraform show -no-color tfplan-cloudfront
            echo "## Stage 2: Remaining infrastructure"
            terraform show -no-color tfplan-full
            echo 'Review both plans before approving the protected destroy job.'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy approved infrastructure
    needs: plan-destroy
    runs-on: ubuntu-latest
    environment:
      name: infra-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DESTROY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: domusnet-terraform-destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create fresh CloudFront teardown plan
        run: terraform plan -destroy -target=module.cloudfront -input=false -no-color -out=tfplan-cloudfront

      - name: Apply CloudFront teardown plan
        run: terraform apply -input=false -no-color -auto-approve tfplan-cloudfront

      - name: Create fresh plan for remaining infrastructure
        run: terraform plan -destroy -input=false -no-color -out=tfplan-full

      - name: Apply remaining destroy plan
        run: terraform apply -input=false -no-color -auto-approve tfplan-full
