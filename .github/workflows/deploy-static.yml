name: Publicar sitio en S3 y CloudFront

on:
  push:
    branches:
      - master
    paths:
      - "app/**"
      - ".github/workflows/deploy-static.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar sitio web
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsStaticDeploy

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Obtener datos de Terraform
        id: terraform-outputs
        shell: bash
        run: |
          set -euo pipefail

          terraform init -input=false

          BUCKET=$(terraform output -raw assets_bucket)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)

          test -n "$BUCKET"
          test -n "$DISTRIBUTION_ID"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Publicar archivos en S3
        env:
          ASSETS_BUCKET: ${{ steps.terraform-outputs.outputs.bucket }}
        run: |
          aws s3 sync app/ "s3://${ASSETS_BUCKET}/" --delete --no-progress

      - name: Invalidar caché de CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.terraform-outputs.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
