name: DOMUSNET CI/CD

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domusnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Analizar seguridad con Checkov
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Ejecutar Checkov
        run: |
          python3 -m pip install --disable-pip-version-check checkov==3.4.3
          checkov -d . --framework terraform --quiet --output sarif --output-file-path .

      - name: Subir resultados SARIF a GitHub
        if: always() && hashFiles('results_sarif.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results_sarif.sarif
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  validate:
    name: Validar Terraform
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Revisar formato
        run: terraform fmt -check -recursive

      - name: Inicializar proveedores
        run: terraform init -backend=false -input=false

      - name: Validar configuración
        run: terraform validate -no-color

  deploy-infrastructure:
    name: Aplicar infraestructura en AWS
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: us-east-1

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraform

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Inicializar backend remoto
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform init -input=false

      - name: Crear Terraform Plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Ejecutar Terraform Apply
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -input=false -auto-approve tfplan

  publish-site:
    name: Publicar sitio en S3 y CloudFront
    needs: deploy-infrastructure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Autenticar en AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsStaticDeploy

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Obtener datos de Terraform
        id: terraform-outputs
        shell: bash
        run: |
          set -euo pipefail

          terraform init -input=false

          BUCKET=$(terraform output -raw assets_bucket)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)

          test -n "$BUCKET"
          test -n "$DISTRIBUTION_ID"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Publicar archivos en S3
        env:
          ASSETS_BUCKET: ${{ steps.terraform-outputs.outputs.bucket }}
        run: aws s3 sync app/ "s3://${ASSETS_BUCKET}/" --delete --no-progress

      - name: Invalidar caché de CloudFront
        env:
          DISTRIBUTION_ID: ${{ steps.terraform-outputs.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
